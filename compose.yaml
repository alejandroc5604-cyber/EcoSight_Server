services:
  api:
    build: ./docker-pythonAPI
    volumes:
      - data:/app/data
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./docker-nginx/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker-nginx/html:/usr/share/nginx/html:ro
    depends_on:
      - api
    restart: unless-stopped

volumes:
  data: